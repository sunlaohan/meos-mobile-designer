<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#202225" />
    <meta name="description" content="基于 Persagy Vant 的可视化移动端页面设计器" />
    <title>Meri Mobile Designer</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      if (window.location.protocol === 'file:') {
        document.getElementById('app').innerHTML = `
          <main style="min-height:100vh;display:grid;place-items:center;background:#17181b;color:#f7f8fa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:32px;box-sizing:border-box">
            <section style="width:min(520px,100%);padding:32px;border:1px solid #35383f;border-radius:18px;background:#222429;box-shadow:0 24px 60px rgba(0,0,0,.3)">
              <div style="font-size:14px;color:#8ea8ff;margin-bottom:12px">Meri Mobile Designer</div>
              <h1 style="font-size:24px;line-height:1.35;margin:0 0 12px">需要通过本地服务打开</h1>
              <p style="margin:0 0 20px;color:#b4b8c1;line-height:1.7">请不要直接双击 index.html。在项目目录运行下面的命令，再访问本地地址。</p>
              <code style="display:block;padding:14px 16px;border-radius:10px;background:#151619;color:#dfe4ee;font-size:14px">pnpm dev</code>
              <a href="http://127.0.0.1:4173/" style="display:inline-flex;margin-top:20px;padding:10px 16px;border-radius:10px;background:#5b7cff;color:#fff;text-decoration:none;font-weight:600">打开设计器</a>
            </section>
          </main>
        `;
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
